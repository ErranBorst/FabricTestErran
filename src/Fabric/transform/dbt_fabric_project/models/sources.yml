version: 2

sources:
  - name: fabric_raw
    description: Raw Delta tables loaded by Fabric ingest notebooks.
    schema: "{{ target.schema }}"
    tables:
      - name: raw_dummy_orders
        description: Raw dummy sales orders loaded by the ingest notebook.

models:
  - name: bronze_dummy_orders
    description: Standardized raw order records from the landing zone.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
  - name: silver_dummy_orders
    description: Clean order facts with derived revenue and load timestamps.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: order_status
        tests:
          - not_null
  - name: gold_order_sales_summary
    description: Curated daily sales summary for reporting.
    columns:
      - name: order_date
        tests:
          - not_null
