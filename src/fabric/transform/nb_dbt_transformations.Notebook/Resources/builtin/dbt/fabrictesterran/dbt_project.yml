name: 'fabrictesterran'
version: '1.0.0'
config-version: 2

profile: 'fabrictesterran'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

quoting:
  identifier: true

models:
  fabrictesterran:
    # Staging: 1:1 with a source table. union (if multi-tenant) + cast + rename to snake_case only.
    # No business logic, no joins — the only place source() is allowed to appear.
    bronze:
      +materialized: ephemeral
    # Business marts: joins, enrichment, deduplication, surrogate keys, business rules. ref()-only.
    # This is where most engineering effort goes.
    silver:
      +database: lh_silver
      +schema: dbo
      +materialized: table
      +pre-hook: "{{ set_datetime_rebase_policy() }}"
    # Presentation layer: explicit column selection, renamed for the consuming report/semantic model.
    # No select *, no business logic beyond presentation shaping.
    gold:
      +database: lh_gold
      +schema: dbo
      +materialized: table
      +pre-hook: "{{ set_datetime_rebase_policy() }}"
