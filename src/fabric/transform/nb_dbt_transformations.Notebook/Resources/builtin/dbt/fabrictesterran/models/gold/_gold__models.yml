version: 2

models:
  - name: orders_gold
    description: >
      Thin presentation view over silver `orders`, aliased to the physical table name `orders` in
      lh_gold. The example gold entity.
    columns:
      - name: order_key
        data_tests:
          - unique
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
              values: ['created', 'shipped', 'delivered', 'cancelled']
